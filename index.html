<form action="https://formspree.io/f/xdayrjrv" method="POST" class="space-y-4">
    <div>
        <label class="block text-sm mb-2 text-gray-400">Nombre</label>
        <input type="text" name="name" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white outline-none focus:border-green-500" required>
    </div>
    <div>
        <label class="block text-sm mb-2 text-gray-400">Email</label>
        <input type="email" name="_replyto" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white outline-none focus:border-green-500" required>
    </div>
    <div>
        <label class="block text-sm mb-2 text-gray-400">Mensaje</label>
        <textarea name="message" rows="4" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white outline-none focus:border-green-500" required></textarea>
    </div>
    <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg transition">Enviar Mensaje</button>
</form>
