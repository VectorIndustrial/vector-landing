<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Industrial | IP Architects</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; scroll-behavior: smooth; font-family: 'Inter', sans-serif; }
        .nav-glass { background: rgba(13, 17, 23, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid #30363d; }
        .hero-title { font-weight: 800; letter-spacing: -0.05em; line-height: 0.9; }
        .card-ip { background: #161b22; border: 1px solid #30363d; transition: all 0.3s ease; }
        .card-ip:hover { border-color: #58a6ff; transform: translateY(-2px); }
        
        @keyframes scan-line { 0% { top: -5%; } 100% { top: 105%; } }
        .scanner::after {
            content: ""; position: absolute; width: 100%; height: 6px; 
            background: #a855f7; 
            box-shadow: 0 0 30px 10px rgba(168, 85, 247, 0.7);
            animation: scan-line 3s linear infinite;
            z-index: 20;
        }
        .hidden-element { display: none !important; }
    </style>
</head>
<body class="font-sans">

    <nav class="p-4 nav-glass sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="https://github.com/VectorIndustrial/vector-landing" class="hover:opacity-80 transition">
                    <img src="LogoVI.png" alt="Vector" class="h-8">
                </a>
                <span class="font-mono text-xs text-gray-500 uppercase hidden md:block">Deep Tech / San Luis, AR</span>
            </div>
            <div class="flex items-center gap-6 text-sm font-semibold">
                <a href="dashboard.html" class="text-gray-400 hover:text-green-400 transition">OPORTUNIDADES</a>
                <button onclick="checkAccess()" class="text-purple-400 border border-purple-900/50 px-3 py-1 rounded-md hover:bg-purple-900/20 font-mono transition">🔒 ACCESO IP</button>
            </div>
        </div>
    </nav>

    <header class="py-32 px-6 text-center max-w-5xl mx-auto">
        <h1 class="hero-title text-6xl md:text-8xl text-white mb-8 uppercase">Diseño de Plantas <br><span class="text-green-500 italic">AI-Driven</span></h1>
        <p class="text-xl text-gray-400 mb-12 font-light">Modelado energético para optimización y descarbonización industrial.</p>
        <div class="flex justify-center gap-4">
            <a href="#designer" class="bg-blue-600 text-white px-10 py-4 rounded-xl font-bold hover:bg-blue-500 transition shadow-lg shadow-blue-900/20">ABRIR DISEÑADOR</a>
        </div>
    </header>

    <section id="designer" class="py-24 max-w-7xl mx-auto px-6">
        <div class="flex flex-col md:flex-row justify-between items-end mb-12 gap-6">
            <div>
                <h2 class="text-4xl font-bold text-white tracking-tighter uppercase mb-2">Agente Diseñador</h2>
                <p class="text-gray-400">Modo actual: <span id="view-label" class="text-blue-400 font-mono">Ingeniería Inversa</span></p>
            </div>
            <div class="flex bg-gray-900 p-1 rounded-xl border border-gray-800 font-mono text-[10px]">
                <button onclick="toggleView('reverso')" id="btn-reverso" class="px-6 py-2 rounded-lg bg-blue-600 text-white transition-all">INGENIERÍA INVERSA</button>
                <button onclick="toggleView('flujo')" id="btn-flujo" class="px-6 py-2 rounded-lg text-gray-500 hover:text-white transition-all uppercase">Flujo Ingeniería</button>
            </div>
        </div>

        <div class="relative scanner overflow-hidden rounded-3xl border border-gray-800 bg-black shadow-2xl mb-12">
            <img id="img-reverso" src="reverse_engineering.png" class="w-full opacity-90 transition-all duration-500">
            <img id="img-flujo" src="designer_agent_flow.png" class="hidden-element w-full opacity-90 transition-all duration-500">
        </div>

        <div class="max-w-2xl mx-auto text-center">
            <input type="file" id="main-upload" class="hidden-element" onchange="handleFileSelection()">
            <button onclick="document.getElementById('main-upload').click()" class="bg-purple-600 hover:bg-purple-500 text-white px-8 py-4 rounded-xl font-bold transition shadow-xl shadow-purple-900/20 uppercase text-xs tracking-widest">
                📁 Adjuntar Imagen de Producto Final
            </button>
            <div id="success-msg" class="hidden-element mt-4 p-3 bg-blue-500/20 border border-blue-500/50 text-blue-400 text-[10px] font-mono rounded-lg uppercase tracking-widest"></div>
        </div>
    </section>

    <footer class="py-20 border-t border-gray-800 bg-gray-900/20">
        <div class="max-w-6xl mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-8 text-center">
            <div onclick="openModal()" class="card-ip p-8 rounded-2xl cursor-pointer">
                <p class="font-mono text-[10px] text-green-500 mb-2 uppercase">CEO</p>
                <h3 class="text-xl font-bold text-white italic">Jonathan Bosso</h3>
            </div>
            <div onclick="openModal()" class="card-ip p-8 rounded-2xl cursor-pointer">
                <p class="font-mono text-[10px] text-green-500 mb-2 uppercase">CSO</p>
                <h3 class="text-xl font-bold text-white italic">Daniel Guerreiro</h3>
            </div>
            <div onclick="openModal()" class="card-ip p-8 rounded-2xl border-blue-500/30 cursor-pointer">
                <p class="font-mono text-[10px] text-blue-500 mb-2 uppercase">CTO</p>
                <h3 class="text-xl font-bold text-white italic">Juan José López</h3>
            </div>
        </div>
    </footer>

    <div id="lead-modal" class="hidden-element fixed inset-0 z-[100] flex items-center justify-center bg-black/95 backdrop-blur-md p-6">
        <div class="bg-[#161b22] border border-gray-800 p-10 rounded-3xl max-w-md w-full shadow-2xl">
            <h3 class="text-2xl font-bold text-white uppercase text-center mb-6">Solicitar Credenciales</h3>
            <form action="https://formspree.io/f/xdayrjrv" method="POST" class="space-y-4">
                <input type="text" name="nombre" required placeholder="Nombre y Apellido" class="w-full bg-gray-900 border border-gray-800 p-4 rounded-xl text-white outline-none focus:border-blue-500 text-sm">
                <input type="text" name="empresa" required placeholder="Empresa / Industria" class="w-full bg-gray-900 border border-gray-800 p-4 rounded-xl text-white outline-none focus:border-blue-500 text-sm">
                <input type="email" name="email" required placeholder="Email Corporativo" class="w-full bg-gray-900 border border-gray-800 p-4 rounded-xl text-white outline-none focus:border-blue-500 text-sm">
                <button type="submit" class="w-full bg-blue-600 py-4 rounded-xl text-white font-bold hover:bg-blue-500 transition uppercase text-xs">
                    Enviar Datos y Generar Acceso
                </button>
            </form>
            <button onclick="document.getElementById('lead-modal').classList.add('hidden-element')" class="mt-6 text-gray-600 text-[10px] w-full uppercase">Cerrar</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzGBsN83J1b6B1VrBE77MCCGIAhYIkYTqli2EQ9KdXZidecL6O4AeVEwQQyPPJ9LNR-/exec";

        function openModal() {
            document.getElementById('lead-modal').classList.remove('hidden-element');
        }

        function toggleView(mode) {
            const f = document.getElementById('img-flujo');
            const r = document.getElementById('img-reverso');
            const bf = document.getElementById('btn-flujo');
            const br = document.getElementById('btn-reverso');
            const lbl = document.getElementById('view-label');

            if(mode === 'flujo') {
                f.classList.remove('hidden-element'); r.classList.add('hidden-element');
                bf.className = 'px-6 py-2 rounded-lg bg-blue-600 text-white transition-all';
                br.className = 'px-6 py-2 rounded-lg text-gray-500 hover:text-white transition-all uppercase';
                lbl.innerText = "Ingeniería de Planta";
            } else {
                f.classList.add('hidden-element'); r.classList.remove('hidden-element');
                bf.className = 'px-6 py-2 rounded-lg text-gray-500 hover:text-white transition-all uppercase';
                br.className = 'px-6 py-2 rounded-lg bg-blue-600 text-white transition-all';
                lbl.innerText = "Ingeniería Inversa";
            }
        }

        async function handleFileSelection() {
            const mainInput = document.getElementById('main-upload');
            const successMsg = document.getElementById('success-msg');
            
            if (mainInput.files.length > 0) {
                const file = mainInput.files[0];
                
                if (file.size > 10 * 1024 * 1024) {
                    alert("Imagen demasiado pesada. El límite es 10MB.");
                    mainInput.value = "";
                    return;
                }

                const reader = new FileReader();
                successMsg.innerText = "⏳ Alimentando el proceso...";
                successMsg.classList.remove('hidden-element');

                reader.onload = async function(e) {
                    const base64 = e.target.result;

                    try {
                        await fetch(SCRIPT_URL, {
                            method: 'POST',
                            headers: { "Content-Type": "application/json" }, 
                            body: JSON.stringify({
                                base64: base64,
                                type: file.type,
                                filename: file.name
                            })
                        });

                        successMsg.innerText = "✅ Imagen guardada en Drive. Iniciando modelado...";
                        mainInput.value = "";
                        
                        setTimeout(() => {
                            openModal();
                            successMsg.classList.add('hidden-element');
                        }, 2000);

                    } catch (error) {
                        console.error("Error:", error);
                        successMsg.innerText = "❌ Error en la conexión con Drive.";
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function checkAccess() {
            const p = prompt("PASSWORD REQUERIDO:");
            if(p === "vector20-26") window.location.href = "restricted.html";
        }
    </script>
</body>
</html>
